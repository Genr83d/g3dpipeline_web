name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Every engine reports independently, so one browser's failure never
      # hides another's result.
      fail-fast: false
      matrix:
        # `visual` is deliberately absent: the app resolves its fonts from the
        # system, so screenshot baselines are specific to the machine that made
        # them. Until baselines are regenerated on this runner image and
        # committed, running them here would fail for reasons unrelated to the
        # change under review. Run `npm run test:e2e:visual` locally instead.
        project: [chromium, firefox, webkit, responsive]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The Firestore emulator is a Java process, and firebase-tools 15 refuses
      # to start it on a JDK older than 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      # The emulators are driven through `npx firebase`, which resolves to
      # whatever Firebase CLI is on PATH. Nothing in package.json provides one
      # — it is an external requirement like Java, documented in the README —
      # so the runner needs its own. Pinned, because the CLI carries the
      # emulator versions with it and a floating release would change the test
      # backend without a commit.
      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.23.0

      # Cache the emulator jars the Firebase CLI downloads on first run.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}

      - name: Install Playwright browsers
        # --with-deps installs the system libraries WebKit needs; without them
        # WebKit cannot launch at all.
        run: npx playwright install --with-deps ${{ matrix.project == 'responsive' && 'chromium webkit' || matrix.project }}

      - name: Run E2E tests
        run: |
          if [ "${{ matrix.project }}" = "responsive" ]; then
            npm run test:e2e:responsive
          else
            npx playwright test --project=${{ matrix.project }}
          fi

      # The emulator's output is deliberately kept off Playwright's webServer
      # pipes, which means a failure to start leaves nothing in the job log but
      # "Process from config.webServer was not able to start".
      - name: Emulator log
        if: ${{ failure() }}
        run: cat e2e/.logs/emulators.log || echo 'no emulator log produced'

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            e2e/.report
            e2e/.artifacts
          retention-days: 7
          if-no-files-found: ignore
